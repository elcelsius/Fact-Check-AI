[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-factcheck"
version = "0.22.0"
description = "Captura de áudio do Windows e transcrição local para checagem assistida"
requires-python = ">=3.12,<3.14"
dependencies = [
    "PyAudioWPatch==0.2.12.9; sys_platform == 'win32'",
    "faster-whisper==1.2.1",
    "sherpa-onnx==1.13.8",
    "llama-cpp-python==0.3.36",
    "trafilatura==2.3.1",
    "pypdf==6.21.2",
    "av>=15,<17",
    "numpy>=2,<3",
]

[project.scripts]
factcheck = "factcheck.__main__:main"

[tool.setuptools.packages.find]
include = ["factcheck*"]
