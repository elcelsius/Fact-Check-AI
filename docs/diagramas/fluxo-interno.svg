<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1550" viewBox="0 0 1600 1550" role="img" aria-labelledby="title description">
<title id="title">Fact-Check AI — funcionamento interno</title>
<desc id="description">Fluxo atual do áudio aos dossiês: captura, transcrição local, triagem, validação, fila, planejamento, fontes, análise opcional e decisão humana. Funções futuras aparecem em caixas tracejadas.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#61738D"/></marker>
  <marker id="return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B57A22"/></marker>
